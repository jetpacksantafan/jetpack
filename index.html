<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">

  <title>Jetpack Christmas</title>

  <script src="./js-dos.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #jsdos-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <canvas id="jsdos-canvas"></canvas>

  <script>
    let dosInstance = null;

    Dos(document.getElementById("jsdos-canvas"), {
      wdosboxUrl: "./wdosbox.js"
    }).ready((fs, main) => {

      fs.extract("./jetpack.jsdos").then(() => {

        main(["-c", "JETPACK.EXE"]).then((ci) => {
          dosInstance = ci;
        });

      });

    });
  </script>

</body>
</html>
