<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Jetpack Christmas</title>
  <script src="js-dos.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="jsdos-canvas"></canvas>
  </div>

  <script>
    let dosInstance = null;

    Dos(document.getElementById("jsdos-canvas"), {
      wdosboxUrl: "./wdosbox.js"
    }).ready((calculator, wdos) => {
      calculator.run("jetpack.jsdos", "JETPACK.EXE").then((ci) => {
        dosInstance = ci;
      });
    });
  </script>
</body>
</html>
