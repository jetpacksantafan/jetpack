<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Jetpack Christmas</title>
  <script src="js-dos.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script>
    let dosInstance = null;

    Dos(document.getElementById("game-container"), {
      wdosboxUrl: "wdosbox.js"
    }).ready((calculator, wdos) => {
      calculator.run("jetpack.jsdos", "JETPACK.EXE").then((ci) => {
        dosInstance = ci;
      });
    });
  </script>
</body>
</html>
